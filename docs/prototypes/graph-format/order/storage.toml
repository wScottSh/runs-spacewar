# PDP-1 only: the places that share a word with a field of a routine's jda
# Record. Every other place is a register value (AC or IO), or shares its
# word with the place it replaces through a Processor's inout. The multiply
# entries are ../storage.toml's.
"multiply_work.factor_magnitude" = "multiply_call.partial"
"multiply_work.saved_high" = "multiply_call.partial"

# divide: idv holds |divisor| until the steps are done, dvd the remainder,
# IO a cleared word for the halving, the dividend's sign, then the quotient's.
"divide_work.divisor_magnitude" = "divide_call.quotient"
"divide_call.remainder" = "divide_call.high"
"divide_work.cleared" = "divide_call.low"
"divide_work.dividend_sign" = "divide_call.low"
"divide_work.quotient_sign" = "divide_call.low"

# sine: the series keeps x in sin's entry word, x^2 and then the answer in
# cos's (the declared cells of sine and cosine).
"sine_work.x" = "sine_call.x"
"sine_work.x_squared" = "sine_call.x_squared"
"sine_work.answer" = "sine_call.answer"
