# sqt: a jda subroutine. The argument is its entry word, which doubles as
# the remainder; the root comes back in AC; sq1 and sq2 follow the code.

[[place]]
routine = "square_root"
convention = "JDA"
entry = "square_root_call.entry"
result = ["square_root_call.root"]
io = ["square_root_work.input_bits"]

[[place]]
fields = ["square_root_work.passes_left", "square_root_call.root"]
