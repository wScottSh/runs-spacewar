# The main loop and the game control around it (source lines 664-941):
# the frame, the start vectors' routines, the match between
# games, the new game, the control word getters and the object loop. Each
# Network is a block the others jump to; the frame starts again where a
# firing ends.
registers = ["outline_call"]
pool = ["pacing.spare_time", "frame.restart_delay", "frame.objects_seen",
        "score.first", "score.second", "score.games_left", "controls.source"]
# The Network the PDP-1 runs again whenever a firing ends: the host's loop.
repeat = "frame"

# The second restart check's torpedo test (md1 - 2) jumps to mdn when the
# ship has none left, encoded spa i, not the sma a test falling into its
# arm takes: the 1962 programmer's choice of word for the same condition.
[inverse_skip]
"restart_work.second_left" = "restart_countdown"

# The outlines' code lies in the free core right after the table (nnn),
# up to the star catalog.
[addresses]
"outline_code.stroke" = "after table"

[code_words]
"outline_code.stroke" = 0o2105

# Where each ship's outline strokes start is held as the address of their code.
[into]
"ship_outlines.outline" = "outline_code.stroke"

# The walk over the slots. The cursors are set after begin_frame; the
# routine word's cursor is the index. A cursor homed here lives in the
# address field of the first instruction of this unit that reads or writes
# its field, or of the first in the named Processor. A walk from the slot
# after another uses the other cursors (ml2, mx2, ...). The word
# draw_outline's walk starts from (ship_outlines.outline at the slot, as its RUNS
# says) is carried into its home (sp5, the jump into the strokes' words) as
# the second walk begins (mot). runsc refuses the carry unless every calc
# that reaches the walk runs after that walk in the same slot, and
# nothing in the slot writes the field. For a torpedo the load reads past
# the outline array (reach_oracle), and nothing jumps through it (check_frame
# poison, INTENT.md). mas is stepped with the cursors, and nothing reads it.
[walk]
set_after = "begin_frame"
index = "objects.routine"
homes = ["objects.routine", "objects.x", "objects.y", "objects.counter", "ship_outlines.outline"]
home_in = { "objects.cycles" = "charge_time" }
carry = ["draw_outline"]
stray = { after = "ship_flight.angle", cursor = "stray_cursor" }

[encoding.control_source]
control_boxes = { routine = "control_word_routine" }

[streams]
scoreboard = "hlt"

[[place]]
routine = "frame"
io = ["budget"]

[[place]]
routine = "start_with_test_word"

[[place]]
routine = "start_with_control_boxes"

[[place]]
routine = "between_games"

[[place]]
routine = "show_scores"

[[place]]
routine = "new_match"

# AC holds where the outlines go, so the guard on separate_outlines reads
# it into IO (lio ddd).
[[place]]
routine = "new_game"
io_reads = ["outline_setting.separate_outlines"]

[[place]]
routine = "read_control_boxes"
convention = "JSP"
io = ["handoff.control_word"]

[[place]]
routine = "read_test_word"
convention = "JSP"
io = ["handoff.control_word"]

# |dx| is kept in a pool word (mt1) while AC computes |dy|.
[[place]]
routine = "object_loop"
spill = ["dx"]
