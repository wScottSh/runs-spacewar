# The outline compiler (source lines 398-507): ocs, the JSP routine that
# lays out IO twice, then oc, the JDA routine that decodes one outline
# into the strokes' code.
pool = ["outline_compiler.codes_left", "outline_compiler.codes_rest", "pen.saved_x", "pen.saved_y"]

# The strokes are held as the code of their use (docs/rules/held-as-code.md):
# each slot is draw_outline's arm for its member, laid end to end. An end's
# nose is held as the jump to it, which the compiler copies from ocm.
held_as_code = ["outline_code.stroke", "outline_code.back", "outline_compiler.start_over"]

# The flag that says what the next 6 code decodes. Flag 6 also holds
# spaceship.rocket and the central star's mirror bit: each of the three
# sets or clears it before it reads it (clf 6 here, at the star's start,
# and in steer).
[flags]
"outline_compiler.six" = 6

# The outline word the compiler reads is kept in the address field of the
# instruction that reads it (ocg, lio .).
[homes]
"outline_compiler.table" = "pointer"

# Fields that hold a place in a Record collection hold its address.
[into]
"outline_call.code" = "outline_code.stroke"
"outline_call.table" = "outlines.codes"
"outline_compiler.table" = "outlines.codes"

# ocs: lays out IO through oc's entry word, and steps it, as many times as
# the strokes' code holds that word in a row (rcl 9s, half a swap, twice).
# IO takes the word as each code is taken.
[[place]]
store = "outline_code.stroke"
loaded = "take_code"

# The code goes through oc's entry word. The routine steps past the word
# after its call (idx ocx) once mark_start has taken the code's address
# from AC; the jump to the nose lies after its return (ocm), with the word
# the end's jump past its return is built in (ocn). Arms that end alike
# share their last words (oce, ocd).
[[place]]
routine = "compile_outline"
convention = "JDA"
entry = "outline_call.code"
inline = "outline_call.table"
result = ["outline_call.code"]
io = ["outline_reading.codes"]
args_done = "mark_start"
data = ["outline_compiler.start_over"]
tails = "shared"
