# The calc routines for objects that are not flying spaceships: mex, tcr,
# hp1 and hp3, jsp routines the main loop enters with its cursors on the
# current object. The random and diff macros are laid out at each use.
pool = ["explosion_count.particles", "head_out_work.steps"]

# Counts held as the code of their use (docs/rules/held-as-code.md):
# spread as the address field of the xct that runs one of a table of its
# shifts (msh, xct .), scatter as its shift itself, built at run time where
# it runs (mi1).
held_as_code = ["explosion_cloud.scatter"]

[homes]
"explosion_cloud.spread" = "table"

# The routine word: the calc routine's address (the routine calc's match
# runs for the member), with the sign bit when the object does not
# collide. The torpedo's is taken from a constant word (lac (tcr); the
# others without the sign bit are built by law.
[encoding.calc_routine]
explosion = { sign = true }
in_hyperspace = { sign = true }
torpedo = { literal = true }

[streams]
display = "dpy"

[[inline]]
routine = "inertia_x"
shifts = "xct"

[[inline]]
routine = "inertia_y"
shifts = "xct"

[[place]]
routine = "explosion"
convention = "JSP"

[[place]]
shifts = "explosion_cloud.spread"

[[place]]
routine = "torpedo"
convention = "JSP"

# IO holds what the main loop left there; the hyperspace draw shifts it out.
[[place]]
routine = "in_hyperspace"
convention = "JSP"
io_param = "handoff.jump_low"
io = ["rest"]

[[place]]
routine = "breakout"
convention = "JSP"
